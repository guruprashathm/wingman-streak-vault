<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Your Card</title>
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --text: #1b1b1b; --muted: #6b6b6b;
      --line: #e3e1dc; --accent: #b3261e; --accent-text: #ffffff; --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --card: #1d1d1d; --text: #f1f1f1; --muted: #a3a3a3;
              --line: #333; --accent: #e5484d; --accent-text: #fff; --error: #ff7b72; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; justify-content: center; padding: 32px 16px; }
    main { width: 100%; max-width: 440px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 10px;
            border: 1px solid var(--line); background: var(--bg); color: var(--text); }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button, a.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px;
            width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 10px;
            background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600;
            cursor: pointer; text-decoration: none; }
    button.secondary, a.btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button:disabled { opacity: .6; cursor: progress; }
    .msg { margin-top: 12px; min-height: 1.5em; color: var(--muted); }
    .msg:empty { margin: 0; min-height: 0; }
    .msg.error { color: var(--error); }
    #result img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }
    .row { display: flex; gap: 10px; } .row > * { flex: 1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Your card</h1>
  <p class="sub">Enter your ID to unlock your soft copy.</p>

  <div class="panel" id="unlock">
    <form id="form" autocomplete="off">
      <label for="uid">Your ID</label>
      <input id="uid" name="uid" required autocapitalize="characters" spellcheck="false" inputmode="text">
      <button type="submit" id="go">Unlock</button>
    </form>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>

  <div class="panel" id="result" hidden>
    <img id="img" alt="Your card">
    <div class="row">
      <a class="btn" id="download" download="my-card.png">Download</a>
      <button type="button" class="secondary" id="share" hidden>Share</button>
    </div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
